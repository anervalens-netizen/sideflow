name: Build and Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Require signing inputs
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_STORE_PASSWORD"
          echo "$RELEASE_KEYSTORE" | base64 --decode > app/release.keystore
          {
            echo "KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            echo "STORE_FILE=release.keystore"
            echo "STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
          } > keystore.properties
      - name: Test, lint, and build signed release
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintRelease assembleRelease
      - name: Verify signed output exists
        run: test -s app/build/outputs/apk/release/app-release.apk
      - name: Extract changelog
        id: changelog
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          {
            echo 'body<<EOF'
            awk "/### ${TAG_NAME}/ {flag=1; next} /---/ {flag=0} flag" CHANGELOG.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
